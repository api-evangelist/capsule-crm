aid: capsule-crm
name: Capsule CRM
description: >-
  Capsule is a simple online CRM for small and midsize businesses that
  manages contacts, sales pipelines, tasks, projects, and email
  integration with a focus on ease of use. The Capsule API v2 is a
  REST/JSON service exposing parties (people and organisations),
  opportunities, projects, tasks, cases, users, and custom fields for
  integration with marketing, finance, and productivity tools.
  Authentication uses a Bearer token (personal access token or OAuth 2
  access token) against the base URL https://api.capsulecrm.com/api/v2/.
