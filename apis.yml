modified: '2026-05-11'
specificationVersion: '0.19'
apis:
  - aid: capsule-crm:v2-api
    name: Capsule CRM API v2
    description: >-
      REST API for managing Capsule parties (contacts and
      organisations), opportunities, projects (cases), tasks, users,
      tags, and custom fields. Each request must include an
      Authorization Bearer token obtained from a personal access token
      or the OAuth 2 authorization code flow.
    humanURL: https://developer.capsulecrm.com/
    baseURL: https://api.capsulecrm.com/api/v2/
    tags:
